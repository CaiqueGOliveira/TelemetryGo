services:
  web:
    build:
      context: ./web
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    networks:
      - public_net
    volumes:
      - ./web:/app
      - /app/node_modules
    environment:
      # Dentro da rede docker, a web alcança o server via o nome do serviço
      BACKEND_URL: http://server:8080
      NEXT_TELEMETRY_DISABLED: "1"
    depends_on:
      server:
        condition: service_started
    restart: unless-stopped

  server:
    build:
      context: ./server
      dockerfile: Dockerfile.dev
    ports:
      - "8080:8080"
    networks:
      - public_net
      - private_net
    depends_on:
      database1:
        condition: service_healthy
      database2:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      JWT_SECRET: ${JWT_SECRET}
      FRONTEND_URL: http://localhost:3000
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database2:5432/meubanco
      CASSANDRA_HOSTS: database1
      REDIS_URL: redis://redis:6379
    restart: unless-stopped

  database1:
    image: cassandra:5.0
    volumes:
      - cassandra_data:/var/lib/cassandra
    networks:
      - private_net
    environment:
      CASSANDRA_CLUSTER_NAME: telemetrygo
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'SELECT release_version FROM system.local'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    restart: unless-stopped

  database2:
    image: postgres:16-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - private_net
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: meubanco
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - private_net
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  cassandra_data:
  postgres_data:
  redis_data:

networks:
  public_net:
  private_net:
