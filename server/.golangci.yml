run:
  timeout: 5m
  tests: true

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - usestdlibvars
    - misspell
    - revive
    - unconvert
    - nilerr
    - errorlint
    - gosec
    - gocyclo
    - bodyclose
    - noctx
  disable:
    - lll

linters-settings:
  govet:
    enable-all: true
    disable:
      - fieldalignment
  gocyclo:
    min-complexity: 15
  gosec:
    excludes:
      - G101
  errcheck:
    check-type-assertions: true
    check-blank: true

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - gocyclo
        - gosec
        - noctx